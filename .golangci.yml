# golangci-lint v2 configuration. Moderate preset: the "standard" linters
# plus a few low-noise extras. Run locally with `golangci-lint run ./...`
# (see CONTRIBUTING.md for the pinned version).
version: '2'

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - unconvert
  # misspell is not enabled: the codebase ships Spanish UI copy and test
  # strings, which it reports as English misspellings.

  settings:
    staticcheck:
      checks:
        # golangci-lint defaults, plus: skip the De Morgan quick fix, which
        # often makes range checks harder to read.
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1001
    errcheck:
      exclude-functions:
        # Releasing query resources: errors surface through rows.Err() and
        # the statement/connection result, so Close has nothing to add.
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        - (*database/sql.Conn).Close
        # Writes to stdout, hashes or HTTP responses: a failed write is not
        # actionable by the caller.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

  exclusions:
    # templ output starts with "// Code generated by templ - DO NOT EDIT."
    generated: strict
    paths:
      - testdata
    rules:
      # Test cleanup (closing fixtures, removing temp files) may ignore errors.
      # Other unchecked errors in tests (Exec, Scan, Decode, Write) still fail.
      - path: _test\.go
        linters:
          - errcheck
        text: "Error return value of `[^`]+\\.(Close|Remove|RemoveAll)` is not checked"
