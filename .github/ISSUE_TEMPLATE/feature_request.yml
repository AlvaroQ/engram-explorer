name: Feature request
description: Suggest an idea or improvement for engram-explorer
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Have an idea? Please check [existing issues](https://github.com/AlvaroQ/engram-explorer/issues) and [discussions](https://github.com/AlvaroQ/engram-explorer/discussions) first.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? How should it behave?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why they fall short.
